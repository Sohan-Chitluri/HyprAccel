<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyprAccel — Project Workspace</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131720; --panel-header: #181d28;
    --border: #262d3d; --text: #e1e7ec; --text-muted: #7e8b9b;
    --accent: #38bdf8; --green: #22c55e; --red: #ef4444;
    --font: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top Header */
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--panel-header); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-title { font-weight: 700; font-size: 14px; }
  .header-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; }
  .badge { background: #1c2331; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; }

  .header-actions { display: flex; gap: 8px; }
  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn:hover { background: #1c2331; border-color: #323b4e; }
  .btn-primary { background: #0284c7; border-color: #0369a1; color: #fff; }
  .btn-primary:hover { background: #0369a1; border-color: #075985; }
  .btn-accent { background: #15803d; border-color: #166534; color: #fff; }
  .btn-accent:hover { background: #166534; }

  /* Main Layout */
  main { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 1fr 200px; flex: 1; min-height: 0; }

  /* Left: Project Tree */
  .tree-panel { grid-column: 1; grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--panel-header); flex-shrink: 0; }
  .tree-content { flex: 1; overflow-y: auto; padding: 8px 0; font-size: 12px; }
  .tree-folder { padding: 4px 12px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .tree-file { padding: 4px 12px 4px 28px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.1s; }
  .tree-file:hover { background: #1c2331; color: var(--text); }
  .tree-file.active { background: #0369a133; color: var(--accent); border-left: 2px solid var(--accent); padding-left: 26px; }

  /* Center: Source Viewer */
  .source-panel { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .source-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel-header); }
  .source-filename { font-size: 13px; font-weight: 600; font-family: var(--font-mono); }
  .source-content { flex: 1; overflow: auto; padding: 16px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; color: #e6edf3; }

  /* Bottom: Console */
  .console-panel { grid-column: 2; grid-row: 2; border-top: 1px solid var(--border); display: flex; flex-direction: column; background: #0d1117; overflow: hidden; }
  .console-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: var(--panel-header); border-bottom: 1px solid var(--border); }
  .console-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
  .console-content { flex: 1; overflow-y: auto; padding: 8px 12px; font-family: var(--font-mono); font-size: 11px; line-height: 1.4; color: var(--text-muted); white-space: pre-wrap; }
  .log-ok { color: var(--green); }
  .log-err { color: var(--red); }
  .log-info { color: var(--accent); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #323b4e; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-title" id="projectName">Project Workspace</div>
    <div class="header-meta">
      <span class="badge" id="projectBoard">Board: —</span>
      <span class="badge" id="projectId">ID: —</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" id="btnBuild">Build</button>
    <button class="btn btn-accent" id="btnFlash">Build & Flash</button>
    <button class="btn" id="btnVerify">Verify</button>
    <a class="btn" href="/graph" style="text-decoration:none;display:inline-flex;align-items:center;">← Editor</a>
  </div>
</header>

<main>
  <div class="tree-panel">
    <div class="panel-header">Project Explorer</div>
    <div class="tree-content" id="projectTree">
      <!-- Injected by JS -->
    </div>
  </div>

  <div class="source-panel">
    <div class="source-header">
      <div class="source-filename" id="sourceFilename">Select a file</div>
      <button class="btn" id="btnCopy" style="padding:4px 8px;font-size:11px;">Copy</button>
    </div>
    <div class="source-content" id="sourceContent">
// No file selected
    </div>
  </div>

  <div class="console-panel">
    <div class="console-header">
      <span class="console-title">Build Output</span>
    </div>
    <div class="console-content" id="consoleContent">Loading workspace...</div>
  </div>
</main>

<script>
'use strict';

const projectStructure = [
  { folder: 'Hardware', files: [{ name: 'hardware.json', path: '.hypraccel/hardware.json' }] },
  { folder: 'Graph', files: [{ name: 'graph.json', path: '.hypraccel/graph.json' }] },
  { folder: 'Generated', files: [
      { name: 'graph.c', path: 'mbd/esp32/generated/graph.c' },
      { name: 'main.cpp', path: 'mbd/esp32/generated/main.cpp' },
      { name: 'hyp_board_config.h', path: 'mbd/esp32/generated/hyp_board_config.h' },
      { name: 'hyprccel.h', path: 'mbd/esp32/generated/hyprccel.h' },
      { name: 'hyp_esp32.c', path: 'mbd/esp32/generated/hyp_esp32.c' },
      { name: 'hyp_esp32_hw.cpp', path: 'mbd/esp32/generated/hyp_esp32_hw.cpp' }
    ]
  },
  { folder: 'SDK', files: [
      { name: 'hyp_router.c', path: 'mbd/esp32/generated/hyp_router.c' },
      { name: 'hyp_cordic_ref.c', path: 'mbd/esp32/generated/hyp_cordic_ref.c' },
      { name: 'hyp_cordic_ref.h', path: 'mbd/esp32/generated/hyp_cordic_ref.h' }
    ]
  },
  { folder: 'Build', files: [
      { name: 'platformio.ini', path: 'mbd/esp32/platformio.ini' },
      { name: 'build.log', path: '.hypraccel/build.log' }
    ]
  }
];

let activeFilePath = null;
let projectGraph = null;

async function fetchProject() {
  try {
    const res = await fetch('/api/project');
    if (!res.ok) throw new Error('Failed to load project');
    const project = await res.json();
    document.getElementById('projectName').textContent = project.name || 'HyprAccel Project';
    document.getElementById('projectBoard').textContent = 'Board: ' + (project.board || 'None');
    document.getElementById('projectId').textContent = 'ID: ' + (project.id || 'none');
    projectGraph = project.graph;
    renderTree();
    log('Workspace initialized.', 'info');
  } catch (err) {
    log('Error loading project: ' + err.message, 'err');
  }
}

function renderTree() {
  const treeContainer = document.getElementById('projectTree');
  treeContainer.innerHTML = '';
  
  projectStructure.forEach(section => {
    const folderEl = document.createElement('div');
    folderEl.className = 'tree-folder';
    folderEl.innerHTML = '📁 ' + section.folder;
    treeContainer.appendChild(folderEl);
    
    section.files.forEach(file => {
      const fileEl = document.createElement('div');
      fileEl.className = 'tree-file';
      fileEl.innerHTML = '📄 ' + file.name;
      fileEl.onclick = () => loadFile(file.name, file.path, fileEl);
      treeContainer.appendChild(fileEl);
    });
  });
}

async function loadFile(name, path, element) {
  document.querySelectorAll('.tree-file').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');
  
  document.getElementById('sourceFilename').textContent = name;
  const contentEl = document.getElementById('sourceContent');
  contentEl.textContent = 'Loading...';
  
  try {
    const res = await fetch('/api/project/file?path=' + encodeURIComponent(path));
    if (!res.ok) throw new Error('File not found or unreadable');
    const data = await res.json();
    contentEl.textContent = data.content || '';
    activeFilePath = path;
  } catch (err) {
    contentEl.textContent = '// ' + err.message;
  }
}

function log(msg, type = '') {
  const c = document.getElementById('consoleContent');
  const el = document.createElement('div');
  if (type === 'ok') el.className = 'log-ok';
  else if (type === 'err') el.className = 'log-err';
  else if (type === 'info') el.className = 'log-info';
  el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

async function runAction(endpoint, description) {
  if (!projectGraph) {
    log('Error: No graph data found in project.', 'err');
    return;
  }
  log(description + '...', 'info');
  
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(projectGraph)
    });
    const data = await res.json();
    if (res.ok) {
      log('Action succeeded.\n' + (data.log || (data.markers ? 'Markers: ' + data.markers.join(', ') : '')), 'ok');
      // If build.log was active, reload it
      if (activeFilePath === '.hypraccel/build.log') loadFile('build.log', activeFilePath);
    } else {
      log('Action failed: ' + (data.error || data.log || 'Unknown error'), 'err');
      if (activeFilePath === '.hypraccel/build.log') loadFile('build.log', activeFilePath);
    }
  } catch (err) {
    log('Exception: ' + err.message, 'err');
  }
}

document.getElementById('btnBuild').onclick = () => runAction('/api/compile', 'Starting Build');
document.getElementById('btnFlash').onclick = () => runAction('/api/flash', 'Starting Build & Flash');
document.getElementById('btnVerify').onclick = () => runAction('/api/verify', 'Starting Hardware Verification');

document.getElementById('btnCopy').onclick = async () => {
  const content = document.getElementById('sourceContent').textContent;
  try {
    await navigator.clipboard.writeText(content);
    log('Source copied to clipboard.', 'info');
  } catch (err) {
    log('Failed to copy to clipboard.', 'err');
  }
};

fetchProject();
</script>
</body>
</html>
