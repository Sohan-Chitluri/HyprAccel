<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyprAccel · MBD Graph Editor</title>
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css">
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing:border-box } body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:13px Inter,system-ui,sans-serif }
  header { height:52px; display:flex; align-items:center; gap:14px; padding:0 18px; border-bottom:1px solid var(--line); background:#11161d }
  .logo { color:var(--accent); font-weight:700; letter-spacing:.04em; font-size:16px } h1 { margin:0; font-size:14px; font-weight:600 } .crumb { color:var(--muted) }
  .toolbar { margin-left:auto; display:flex; align-items:center; gap:8px } button, input, select { font:inherit; color:var(--text) }
  button { border:1px solid var(--line); border-radius:6px; padding:7px 12px; background:var(--panel2); cursor:pointer } button:hover { border-color:var(--accent) }
  .build { background:var(--green); border-color:var(--green); color:#07110a; font-weight:700 } .graph-id { width:155px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg) }
  main { height:calc(100vh - 52px); display:grid; grid-template-columns:190px minmax(400px,1fr) 310px }
  aside, .config { background:var(--panel); border-right:1px solid var(--line); overflow:auto } .config { border-right:0; border-left:1px solid var(--line); }
  .section-title { padding:13px 14px 8px; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em }
  .palette { padding:0 10px 14px; display:grid; gap:7px } .palette-item { padding:10px; border:1px solid var(--line); background:var(--panel2); border-radius:7px; cursor:grab; user-select:none }
  .palette-item:active { cursor:grabbing } .palette-item small { display:block; color:var(--muted); margin-top:3px; font-size:10px }
  .hint { padding:12px 14px; color:var(--muted); line-height:1.5; border-top:1px solid var(--line); font-size:11px }
  .canvas { position:relative; background-color:#0d1117; background-image:radial-gradient(#27313c 1px,transparent 1px); background-size:20px 20px }
  .react-flow__controls button { background:var(--panel2); color:var(--text); border-color:var(--line) }.react-flow__minimap { background:var(--panel) }.react-flow__attribution { display:none }
  .node { min-width:170px; border:1px solid #49627e; border-radius:8px; background:#182333; box-shadow:0 5px 15px #0005; overflow:visible }.node.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent),0 5px 15px #0007 }
  .node-head { padding:8px 11px; border-bottom:1px solid #30445a; font-weight:700; display:flex; justify-content:space-between; gap:10px }.node-type { color:var(--accent); font-size:11px }.node-label { color:var(--muted); font-size:10px; font-weight:400 }.ports { padding:7px 0 }.port { position:relative; min-height:21px; padding:2px 12px; color:#c9d1d9; font-size:11px }.port.in { text-align:left; padding-left:19px }.port.out { text-align:right; padding-right:19px }.port-type { color:var(--muted); font-size:10px; margin-left:5px }.port.out .port-type { margin-right:5px; margin-left:0 }
  .config h2 { padding:15px 15px 9px; margin:0; font-size:13px; border-bottom:1px solid var(--line) }.empty { color:var(--muted); padding:16px; line-height:1.5 }.form { padding:14px; display:grid; gap:11px }.field { display:grid; gap:5px }.field label { color:var(--muted); font-size:11px }.field input,.field select { width:100%; padding:7px 8px; border-radius:5px; border:1px solid var(--line); background:var(--bg) }.check { display:flex; align-items:center; gap:7px; color:var(--muted) }.embed { width:100%; height:490px; border:0; border-top:1px solid var(--line); background:#0d1117 }.embed-note { padding:11px 14px; color:var(--muted); line-height:1.4; font-size:11px }
  .output { border-top:1px solid var(--line); margin-top:12px }.output pre { margin:0; padding:12px 14px; max-height:280px; overflow:auto; white-space:pre-wrap; color:#c9d1d9; font:11px/1.55 ui-monospace,SFMono-Regular,monospace }.status { padding:8px 14px; color:var(--muted); border-top:1px solid var(--line); font-size:11px }.ok { color:var(--green) }.error { color:#ff7b72 }
</style>
</head>
<body>
<header><span class="logo">HyprAccel</span><span class="crumb">›</span><h1>MBD Graph Editor</h1><div class="toolbar"><label class="crumb" for="graphId">Graph ID</label><input id="graphId" class="graph-id" value="editor-graph"><button id="clear">Clear</button><button id="build" class="build">▶ Build</button></div></header>
<main><aside><div class="section-title">Node vocabulary</div><div id="palette" class="palette"></div><div class="hint">Drag a node onto the canvas. Connect an output handle to an input handle. Select a node to edit its parameters.</div><div class="section-title">External input</div><div class="hint">CORDIC angle inputs are bound to <code>angle_rad</code> automatically, matching the graph examples and graph_to_c.js contract.</div></aside><section id="canvas" class="canvas"></section><section id="config" class="config"></section></main>
<script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
<script>
'use strict';
const h = React.createElement;
const RF = window.ReactFlow;
const defaults = {
  SensorInput:{source:'imu.yaw_rad',valueType:'number',samplePeriodUs:1000,unit:'rad'},
  CordicOp:{operation:'sin',implementation:'auto',iterations:16},
  KinematicsSolve:{mode:'forward',robotModel:'arm6dof',maxIterations:100,tolerance:0.0001},
  ControlLoop:{kp:1,ki:0,kd:0,samplePeriodUs:1000,outputMin:-1,outputMax:1,initialOutput:0},
  ActuatorOutput:{target:'joint1.motor',unit:'rad/s',min:-1,max:1,safeValue:0},
  Publish:{topic:'telemetry/value',transport:'telemetry',retain:false}
};
const descriptions = {SensorInput:'board / simulator signal',CordicOp:'trigonometric operation',KinematicsSolve:'robot kinematics',ControlLoop:'discrete PID step',ActuatorOutput:'board actuator endpoint',Publish:'telemetry / log output'};
const portTypes = {SensorInput:{in:[],out:[['value','any'],['timestamp_us','number'],['valid','boolean']]},CordicOp:{in:[['angle_rad','number']],out:[['value','number'] ]},KinematicsSolve:{in:[['joint_positions_rad','vector<number>']],out:[['end_effector_pose','pose']]},ControlLoop:{in:[['setpoint','number'],['measurement','number'],['enable','boolean']],out:[['command','number'],['error','number']]},ActuatorOutput:{in:[['command','number'],['enable','boolean']],out:[['applied','number'],['active','boolean']]},Publish:{in:[['value','any'],['timestamp_us','number']],out:[['published','boolean']]}};
function ports(type, params) { if (type==='CordicOp') { if(params.operation==='atan2') return {in:[['y','number'],['x','number']],out:[['angle_rad','number']]}; if(params.operation==='sincos') return {in:[['angle_rad','number']],out:[['sin','number'],['cos','number']]}; } return portTypes[type]; }
function makeNode(type, id, position) { return {id, type:'graphNode', position, data:{nodeType:type, label:type+' '+id, params:JSON.parse(JSON.stringify(defaults[type]))}}; }
function NodeView({data, selected}) { const ps=ports(data.nodeType,data.params); const rows=[]; ps.in.forEach(([name,type])=>rows.push(h('div',{className:'port in',key:'i'+name},h(RF.Handle,{type:'target',position:RF.Position.Left,id:name}),name,h('span',{className:'port-type'},type)))); ps.out.forEach(([name,type])=>rows.push(h('div',{className:'port out',key:'o'+name},h('span',{className:'port-type'},type),name,h(RF.Handle,{type:'source',position:RF.Position.Right,id:name}))); return h('div',{className:'node'+(selected?' selected':'')},h('div',{className:'node-head'},h('span',{className:'node-type'},data.nodeType),h('span',{className:'node-label'},data.label)),h('div',{className:'ports'},rows)); }
const nodeTypes={graphNode:NodeView};
let nextId=1, rfInstance=null, selectedId=null, graphNodes=[], graphEdges=[];
const paletteTypes=['SensorInput','CordicOp','KinematicsSolve','ControlLoop','ActuatorOutput','Publish'];
function setState(nodes,edges){graphNodes=nodes;graphEdges=edges;renderConfig();}
function addNode(type, position){ const id=type.replace(/[^A-Za-z]/g,'').toLowerCase()+'_'+nextId++; setState([...graphNodes,makeNode(type,id,position||{x:120+nextId*15,y:120+nextId*10})],graphEdges); }
function updateParam(key,value){ const n=graphNodes.find(x=>x.id===selectedId); if(!n)return; const params={...n.data.params,[key]:value}; setState(graphNodes.map(x=>x.id===selectedId?{...x,data:{...x.data,params}}:x),graphEdges); }
function field(key,value,type){ return h('div',{className:'field',key},h('label',null,key),type==='select'?h('select',{value,onChange:e=>updateParam(key,e.target.value)},(key==='operation'?['sin','cos','sincos','atan2']:key==='implementation'?['auto','software','hardware']:['forward','inverse']).map(x=>h('option',{key:x},x))):type==='check'?h('label',{className:'check'},h('input',{type:'checkbox',checked:!!value,onChange:e=>updateParam(key,e.target.checked)}),'enabled'):h('input',{type:type||'text',value:value??'',step:'any',onChange:e=>updateParam(key,type==='number'?Number(e.target.value):e.target.value)})); }
function renderConfig(){ const el=document.getElementById('config'); const n=graphNodes.find(x=>x.id===selectedId); if(!n){el.innerHTML='<h2>Node configuration</h2><div class="empty">Select a node to configure it.</div>';return;} const t=n.data.nodeType,p=n.data.params; if(t==='SensorInput'||t==='ActuatorOutput'){el.innerHTML='<h2>'+t+' configuration</h2><div class="embed-note">This node uses the existing pin-configuration screen. Assign board pins there; the view is embedded from <code>pin_config.html</code>, not duplicated.</div><iframe class="embed" src="/pin_config.html?embed=1" title="Pin configuration"></iframe>';return;} let keys=[]; if(t==='CordicOp')keys=[['operation','select'],['implementation','select'],['iterations','number']]; if(t==='KinematicsSolve')keys=[['mode','select'],['robotModel','text'],['maxIterations','number'],['tolerance','number']]; if(t==='ControlLoop')keys=['kp','ki','kd','samplePeriodUs','outputMin','outputMax','initialOutput'].map(x=>[x,'number']); if(t==='Publish')keys=[['topic','text'],['transport','select'],['retain','check']]; el.innerHTML=''; el.appendChild(Object.assign(document.createElement('h2'),{textContent:t+' configuration'})); const form=document.createElement('div');form.className='form'; ReactDOM.render(h(React.Fragment,null,keys.map(([k,ty])=>field(k,p[k],ty))),form);el.appendChild(form); }
function toGraph(){ const graphId=document.getElementById('graphId').value.trim()||'editor-graph'; const nodes=graphNodes.map(n=>({id:n.id,type:n.data.nodeType,label:n.data.label,params:n.data.params,position:{x:n.position.x,y:n.position.y}})); const cordics=nodes.filter(n=>n.type==='CordicOp'); return {format:'hypraccel.mbd.graph',version:1,id:graphId,name:graphId,nodes,edges:graphEdges.map(e=>({id:e.id,from:{node:e.source,port:e.sourceHandle},to:{node:e.target,port:e.targetHandle}})),inputs:cordics.length?[{name:'angle_rad',type:'number',unit:'rad'}]:[],metadata:cordics.length?{externalBindings:cordics.map(n=>({input:'angle_rad',to:{node:n.id,port:'angle_rad'}}))}:undefined}; }
async function build(){ const status=document.getElementById('status'); const output=document.getElementById('output'); if(status)status.remove(); if(output)output.remove(); const p=document.createElement('div');p.className='output';p.id='output';p.innerHTML='<pre>Building…</pre>';document.getElementById('config').appendChild(p); try {const r=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(toGraph())});const data=await r.json();p.innerHTML='<pre class="'+(r.ok?'ok':'error')+'"></pre><div class="status '+(r.ok?'ok':'error')+'">'+(r.ok?'Build succeeded':'Build failed')+'</div>';p.querySelector('pre').textContent=r.ok?data.source:data.error;}catch(e){p.innerHTML='<pre class="error">'+e.message+'</pre>';}}
function App(){ const [nodes,setNodes]=React.useState(graphNodes),[edges,setEdges]=React.useState(graphEdges); graphNodes=nodes;graphEdges=edges; return h(RF.ReactFlow,{nodes,edges,nodeTypes,onNodesChange:changes=>{const next=RF.applyNodeChanges(changes,nodes);setNodes(next);graphNodes=next;renderConfig();},onEdgesChange:changes=>{const next=RF.applyEdgeChanges(changes,edges);setEdges(next);graphEdges=next;},onConnect:c=>{const e={...c,id:c.source+'-'+c.sourceHandle+'-'+c.target+'-'+c.targetHandle};const next=[...edges,e];setEdges(next);graphEdges=next;},onNodeClick:(_,n)=>{selectedId=n.id;renderConfig();},onPaneClick:()=>{selectedId=null;renderConfig();},onInit:i=>{rfInstance=i},fitView:true},h(RF.Background,{gap:20}),h(RF.Controls),h(RF.MiniMap)); }
paletteTypes.forEach(type=>{const el=document.createElement('div');el.className='palette-item';el.draggable=true;el.dataset.type=type;el.innerHTML=type+'<small>'+descriptions[type]+'</small>';el.addEventListener('dragstart',e=>e.dataTransfer.setData('application/hypraccel-node',type));document.getElementById('palette').appendChild(el);});
document.getElementById('canvas').addEventListener('dragover',e=>e.preventDefault()); document.getElementById('canvas').addEventListener('drop',e=>{e.preventDefault();const type=e.dataTransfer.getData('application/hypraccel-node');if(!type||!rfInstance)return;const r=e.currentTarget.getBoundingClientRect();addNode(type,rfInstance.project({x:e.clientX-r.left,y:e.clientY-r.top}));});
document.getElementById('clear').onclick=()=>{nextId=1;selectedId=null;setState([],[]);ReactDOM.render(h(App),document.getElementById('canvas'));};document.getElementById('build').onclick=build;
ReactDOM.render(h(App),document.getElementById('canvas'));renderConfig();
</script>
</body>
</html>
