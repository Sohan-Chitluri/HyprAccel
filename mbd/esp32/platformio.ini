; HyprAccel MBD-T9: ESP32-WROOM-32 live reflash target.
; The server materializes generated graph C and this runtime wrapper in
; generated/ immediately before invoking PlatformIO.

[platformio]
src_dir = generated

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -I ../../sdk/include
    -I ../../sdk/src
    -I ../../boards/codegen
